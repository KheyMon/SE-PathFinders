<!doctype html>
<html>
<head><meta charset="utf-8"><title>Job Details</title><link rel="stylesheet" href="css/style.css"></head>
<body>
  <div class="header container">
    <div class="nav"><div class="logo">PathFinder</div><div class="nav-right"><a href="index.html">Home</a><a href="browse-jobs.html">Browse</a></div></div>
  </div>
  <div class="container">
    <div id="jobArea" class="form"></div>
  </div>
<script src="js/app.js"></script>
<script>
(async ()=>{
  const id = getQueryParam('id');
  if(!id) { document.getElementById('jobArea').innerText='Missing job id'; return; }
  const data = await api(`fetch_job.php?id=${id}`);
  if (data.error) { document.getElementById('jobArea').innerText = data.error; return; }
  const html = `
    <h2>${data.title}</h2>
    <div class="small">Posted by ${data.employer_name} • ${data.location}</div>
    <p>${data.description}</p>
    <h4>Apply</h4>
    <textarea id="resume" placeholder="Paste resume or introduction"></textarea>
    <button class="btn primary" id="applyBtn">Apply</button>
  `;
  document.getElementById('jobArea').innerHTML = html;
  document.getElementById('applyBtn').addEventListener('click', async ()=>{
    const resume = document.getElementById('resume').value;
    const res = await api('apply_job.php','POST',{job_id:id,resume});
    if (res.ok) alert('Applied successfully'); else alert(res.error || 'error');
  });
})();
</script>
</body>
</html>
