<!doctype html>
<html>
<head><meta charset="utf-8"><title>Login</title><link rel="stylesheet" href="css/style.css"></head>
<body>
  <div class="header container">
    <div class="nav"><div class="logo">PathFinder</div><div class="nav-right"><a href="index.html">Home</a></div></div>
  </div>
  <div class="container">
    <div class="form" style="max-width:420px">
      <h3>Login</h3>
      <input id="email" class="input" placeholder="Email">
      <input id="password" type="password" class="input" placeholder="Password">
      <button id="btn" class="btn primary">Login</button>
      <div style="margin-top:10px"><a href="register.html">Register</a></div>
    </div>
  </div>
<script src="js/app.js"></script>
<script>
document.getElementById('btn').addEventListener('click', async ()=>{
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const res = await api('login.php','POST',{email,password});
  if (res.ok) {
    alert('Logged in');
    window.location.href = 'index.html';
  } else alert(res.error || 'Login failed');
});
</script>
</body>
</html>
